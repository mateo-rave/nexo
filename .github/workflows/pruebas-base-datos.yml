# Ejecuta las pruebas pgTAP de supabase/tests/, las pruebas de integración de
# API de pruebas/api/ (Deno + supabase-js) y las pruebas E2E del frontend
# (Playwright) contra un mismo Supabase local y desechable, creado en el
# servidor de GitHub a partir de las migraciones del repositorio. Otro job
# comprueba los tipos, el lint y el build del frontend. No se conecta a
# nexo-dev ni a ningún proyecto remoto: no usa --linked, db push ni secretos.
# Ver ADR-0004 y ADR-0006.
name: Pruebas de base de datos

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Solo lectura del repositorio: el job no publica nada en él. Las capturas de
# la E2E se suben como artefacto de la ejecución, que no necesita más permisos.
permissions:
  contents: read

# Si llega un cambio nuevo a la misma rama, se cancela la ejecución anterior.
concurrency:
  group: pruebas-base-datos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (tipos, lint y build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar las dependencias del frontend
        run: npm ci

      - name: Comprobar los tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Sin variables VITE_: el bundle no lleva ninguna clave.
      - name: Compilar
        run: npm run build

      # El frontend solo puede llevar la clave publicable (ADR-0006).
      - name: Comprobar que el bundle no contiene claves secretas
        run: |
          if grep -R -l -E 'sb_secret_|service_role' dist; then
            echo "::error::El bundle del frontend contiene una referencia a una clave secreta." >&2
            exit 1
          fi
          echo "El bundle no contiene claves secretas."

  pgtap:
    name: pgTAP, API y E2E en Supabase local
    # Los servidores Ubuntu de GitHub ya traen Docker, que necesita la CLI.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # Acciones fijadas por SHA de commit (no por etiqueta) para que nadie
      # pueda cambiar su código sin que lo notemos.
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      # Instala exactamente la versión de la CLI fijada en package-lock.json.
      - name: Instalar la CLI de Supabase
        run: npm ci

      - name: Comprobar la versión de la CLI
        run: npx supabase --version

      # Crea la base de datos local y aplica supabase/migrations/ en orden.
      # Al terminar, "supabase start" imprime las claves del Supabase local
      # (incluida una sb_secret_), así que su salida va a un archivo temporal
      # del runner, que no se sube como artefacto y desaparece con él.
      # - Si el inicio va bien, solo se muestran las líneas "Applying
      #   migration <versión>_<nombre>.sql..." (lista de permitidos estricta).
      # - Si falla, se muestran las últimas líneas saneadas: se descartan
      #   enteras las que mencionan claves, secretos, contraseñas o tokens, y
      #   en el resto se ocultan claves sb_, JWT, credenciales de URL y
      #   cualquier cadena larga. El paso falla con el código real.
      - name: Levantar Supabase local y aplicar las migraciones
        run: |
          registro="$RUNNER_TEMP/supabase-start.log"
          if npx supabase start > "$registro" 2>&1; then
            grep -E '^Applying migration [0-9]{14}_[a-z0-9_]+\.sql\.\.\.$' "$registro" || true
            echo "Supabase local iniciado correctamente (salida completa omitida: contiene claves locales)."
          else
            codigo=$?
            echo "::error::npx supabase start falló con el código $codigo. Diagnóstico saneado:"
            grep -v -i -E 'key|secret|password|passwd|token|jwt|anon|service_role|authorization|bearer' "$registro" \
              | sed -E \
                  -e 's/sb_(secret|publishable)_[A-Za-z0-9_-]+/sb_\1_[oculto]/g' \
                  -e 's/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]*)?/[jwt oculto]/g' \
                  -e 's#([A-Za-z][A-Za-z0-9+.-]*://)[^/@[:space:]]+@#\1[credenciales ocultas]@#g' \
                  -e 's/[A-Za-z0-9+\/=_-]{32,}/[valor oculto]/g' \
              | tail -n 200
            exit "$codigo"
          fi

      # --local deja explícito que nunca se prueba contra un proyecto remoto.
      - name: Ejecutar las pruebas pgTAP
        run: npx supabase test db --local

      - name: Preparar Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8

      # Descarga supabase-js, comprueba sus hashes contra pruebas/api/deno.lock
      # (congelado: falla si no coinciden) y comprueba los tipos.
      - name: Comprobar las pruebas de API
        working-directory: pruebas/api
        env:
          DENO_DIR: ${{ runner.temp }}/deno
        run: deno check --frozen *.ts

      # Reutiliza el Supabase local de los pasos anteriores.
      # De "supabase status" solo se extraen la URL de la API y la clave
      # publicable; el resto de la salida (claves secretas, contraseña de la
      # base) ni se imprime ni llega a las pruebas. env -i arranca Deno con un
      # entorno vacío salvo esas dos variables, y sus permisos limitan la red
      # al puerto local de la API y el entorno a esas mismas variables.
      - name: Ejecutar las pruebas de API
        env:
          DENO_DIR: ${{ runner.temp }}/deno
        run: |
          estado="$(npx supabase status -o env)"
          url="$(printf '%s\n' "$estado" | sed -n -E 's/^API_URL="?([^"]*)"?$/\1/p')"
          clave="$(printf '%s\n' "$estado" | sed -n -E 's/^PUBLISHABLE_KEY="?([^"]*)"?$/\1/p')"
          unset estado
          if [ -z "$url" ] || [ -z "$clave" ]; then
            echo "No se pudieron leer API_URL y PUBLISHABLE_KEY del Supabase local." >&2
            exit 1
          fi
          echo "::add-mask::$clave"
          servidor="$(printf '%s' "$url" | sed -E 's#^https?://([^/]+).*$#\1#')"
          cd pruebas/api
          env -i PATH="$PATH" HOME="$HOME" DENO_DIR="$DENO_DIR" NO_COLOR=1 \
            SUPABASE_URL="$url" SUPABASE_PUBLISHABLE_KEY="$clave" \
            deno test --frozen \
              --allow-env=SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY \
              --allow-net="$servidor"

      # Pruebas E2E del frontend contra el mismo Supabase local: compila el
      # frontend con la URL y la clave publicable locales (como en las pruebas
      # de API, nada más sale de "supabase status") y Playwright lo recorre en
      # Chromium sobre "vite preview".
      - name: Instalar las dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Instalar Chromium para Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Ejecutar las pruebas E2E del frontend
        run: |
          estado="$(npx supabase status -o env)"
          url="$(printf '%s\n' "$estado" | sed -n -E 's/^API_URL="?([^"]*)"?$/\1/p')"
          clave="$(printf '%s\n' "$estado" | sed -n -E 's/^PUBLISHABLE_KEY="?([^"]*)"?$/\1/p')"
          unset estado
          if [ -z "$url" ] || [ -z "$clave" ]; then
            echo "No se pudieron leer API_URL y PUBLISHABLE_KEY del Supabase local." >&2
            exit 1
          fi
          echo "::add-mask::$clave"
          cd frontend
          VITE_SUPABASE_URL="$url" VITE_SUPABASE_PUBLISHABLE_KEY="$clave" npm run build
          npm run e2e

      # Capturas de la sección Reglas (e2e/reglas.spec.ts) para la revisión
      # visual. Solo muestran datos sintéticos de este Supabase desechable. Se
      # suben también si la E2E falla, con las que se hayan llegado a hacer.
      - name: Guardar las capturas de la sección Reglas
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capturas-reglas
          path: frontend/test-results/capturas-reglas/
          if-no-files-found: warn
          retention-days: 14
